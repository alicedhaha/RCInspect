name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: moonbitlang/setup-moonbit@v1
      - name: Toolchain
        run: moon version --all
      - name: Format
        shell: bash
        run: |
          moon fmt
          git diff --exit-code
      - name: Generate interfaces
        shell: bash
        run: |
          moon info
          git diff --exit-code
      - name: Check
        run: moon check --deny-warn
      - name: Test
        run: moon test --deny-warn
      - name: Build CLI
        run: moon build cmd/moonrc --target native
      - name: Smoke test
        run: moon run cmd/moonrc -- analyze examples/small.spef
